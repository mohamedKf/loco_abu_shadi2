<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول — LOCO</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{background:linear-gradient(160deg,#1a0800,#0a0a0a);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Cairo',sans-serif;color:#F5F0E8;padding:20px;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 50% 100%,rgba(255,107,0,0.12),transparent);pointer-events:none;}
.box{width:100%;max-width:420px;position:relative;z-index:1;}
.logo-wrap{text-align:center;margin-bottom:32px;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:3.5rem;color:#FFD600;letter-spacing:6px;text-shadow:0 0 30px rgba(255,214,0,.4);}
.logo-sub{font-size:.8rem;color:#888;letter-spacing:3px;margin-top:-4px;}
.card{background:#161616;border:1px solid rgba(255,214,0,.12);padding:32px;}
.card-title{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:#FFD600;letter-spacing:2px;margin-bottom:24px;text-align:center;}
.tabs{display:flex;gap:0;margin-bottom:24px;border:1px solid rgba(255,255,255,.08);}
.tab{flex:1;padding:10px;text-align:center;cursor:pointer;font-size:.85rem;font-weight:700;color:#888;transition:all .2s;background:transparent;border:none;}
.tab.active{background:rgba(255,214,0,.1);color:#FFD600;}
.form-group{margin-bottom:16px;}
.form-label{display:block;font-size:.72rem;font-weight:700;color:#888;letter-spacing:1px;margin-bottom:6px;text-transform:uppercase;}
.form-input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#F5F0E8;padding:12px 14px;font-family:'Cairo',sans-serif;font-size:.95rem;transition:border-color .2s;outline:none;}
.form-input:focus{border-color:#FFD600;}
.form-select{width:100%;background:#1a1a1a;border:1px solid rgba(255,255,255,.1);color:#F5F0E8;padding:12px 14px;font-family:'Cairo',sans-serif;font-size:.95rem;outline:none;}
.form-select:focus{border-color:#FFD600;}
.btn{width:100%;padding:14px;background:#FFD600;color:#0a0a0a;border:none;cursor:pointer;font-family:'Cairo',sans-serif;font-weight:900;font-size:1rem;letter-spacing:1px;clip-path:polygon(10px 0%,100% 0%,calc(100% - 10px) 100%,0% 100%);transition:all .2s;margin-top:8px;}
.btn:hover{background:#FF6B00;color:#fff;}
.error{background:rgba(204,34,0,.15);border:1px solid #CC2200;color:#ff8888;padding:10px 14px;font-size:.82rem;margin-bottom:16px;}
.success{background:rgba(0,170,68,.15);border:1px solid #00aa44;color:#88ffaa;padding:10px 14px;font-size:.82rem;margin-bottom:16px;}
.back-link{text-align:center;margin-top:16px;font-size:.8rem;color:#888;}
.back-link a{color:#FFD600;}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:#555;font-size:.75rem;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.08);}

@media(max-width:600px){
  .page-wrap,.cart-wrap,.checkout-wrap{padding:70px 12px 120px !important;}
  .form-row{grid-template-columns:1fr !important;}
  .payment-options{grid-template-columns:1fr 1fr !important;}
  nav{padding:10px 14px !important;}
  .page-title{font-size:1.5rem !important;}
}
</style>
</head>
<body>
<div class="box">
  <div class="logo-wrap">
    <div class="logo">🔥 LOCO</div>
    <div class="logo-sub">أبو شادي — إدارة المطعم</div>
  </div>

  <div class="card">
    <!-- Tabs -->
    <div class="tabs">
      <button class="tab {% if not show_register %}active{% endif %}" onclick="showTab('login')">تسجيل الدخول</button>
      <button class="tab {% if show_register %}active{% endif %}" onclick="showTab('register')">إنشاء حساب</button>
    </div>

    <!-- Messages -->
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    {% if success %}<div class="success">{{ success }}</div>{% endif %}

    <!-- Login Form -->
    <div id="loginForm" {% if show_register %}style="display:none"{% endif %}>
      <div class="card-title">مرحباً بك 👋</div>
      <form method="POST" action="/accounts/login/">
        {% csrf_token %}
        <input type="hidden" name="form_type" value="login">
        <div class="form-group">
          <label class="form-label">اسم المستخدم</label>
          <input class="form-input" type="text" name="username" autofocus required placeholder="اسم المستخدم">
        </div>
        <div class="form-group">
          <label class="form-label">كلمة المرور</label>
          <input class="form-input" type="password" name="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn">دخول →</button>
      </form>
    </div>

    <!-- Register Form -->
    <div id="registerForm" {% if not show_register %}style="display:none"{% endif %}>
      <div class="card-title">حساب جديد ✨</div>
      <form method="POST" action="/accounts/register/">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label">اسم المستخدم</label>
          <input class="form-input" type="text" name="username" required placeholder="اسم المستخدم (بالإنجليزية)">
        </div>
        <div class="form-group">
          <label class="form-label">الاسم الكامل</label>
          <input class="form-input" type="text" name="full_name" placeholder="الاسم الكامل (اختياري)">
        </div>
        <div class="form-group">
          <label class="form-label">كلمة المرور</label>
          <input class="form-input" type="password" name="password1" required placeholder="••••••••" minlength="8">
        </div>
        <div class="form-group">
          <label class="form-label">تأكيد كلمة المرور</label>
          <input class="form-input" type="password" name="password2" required placeholder="••••••••">
        </div>
        <div class="form-group">
          <label class="form-label">الدور الوظيفي</label>
          <select class="form-select" name="role">
            <option value="kitchen">👨‍🍳 عامل مطبخ</option>
            <option value="cashier">💳 كاشير</option>
            <option value="owner">👑 مدير / مالك</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">كود التسجيل (مطلوب للمدير)</label>
          <input class="form-input" type="text" name="register_code" placeholder="اطلبه من المالك">
        </div>
        <button type="submit" class="btn">إنشاء الحساب →</button>
      </form>
    </div>

    <div class="back-link">
      <a href="/">← العودة للموقع</a>
    </div>
  </div>
</div>

<script>
function showTab(tab) {
  document.getElementById('loginForm').style.display    = tab === 'login'    ? 'block' : 'none';
  document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', (i===0 && tab==='login') || (i===1 && tab==='register'));
  });
}
</script>
</body>
</html>
