{% extends 'dashboard/base_dashboard.html' %}
{% block title %}تعديل مجموعة{% endblock %}
{% block nav_tops %}active{% endblock %}
{% block topbar_title %}تعديل مجموعة إضافات{% endblock %}
{% block content %}
<div class="page-header">
  <div class="page-head-title">تعديل: {{ group.name_ar }}</div>
  <a href="/dashboard/menu/topping/" class="btn btn-outline btn-sm">← رجوع</a>
</div>
<div class="form-wrap">
  <div class="card">
    <form method="POST">
      {% csrf_token %}
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">الاسم عربي *</label>
          <input class="form-input" type="text" name="group_name_ar" value="{{ group.name_ar }}" dir="rtl" required>
        </div>
        <div class="form-group">
          <label class="form-label">الاسم عبري</label>
          <input class="form-input" type="text" name="group_name_he" value="{{ group.name_he|default:'' }}" dir="rtl">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">الأيقونة (emoji)</label>
          <input class="form-input" type="text" name="group_icon" value="{{ group.icon|default:'' }}" style="max-width:80px;">
        </div>
        <div class="form-group">
          <label class="form-label">الترتيب</label>
          <input class="form-input" type="number" name="group_sort" value="{{ group.sort_order }}" style="max-width:80px;">
        </div>
      </div>
      <div style="display:flex;gap:10px;margin-top:16px;">
        <button type="submit" class="btn btn-yellow" style="padding:12px 32px;">💾 حفظ</button>
        <a href="/dashboard/menu/topping/" class="btn btn-outline" style="padding:12px 24px;">إلغاء</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
